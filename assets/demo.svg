<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Illustration of Baton asking to hand off at 41 percent context, then starting a new session that receives the handoff">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .title { font-size: 13px; fill: #8b949e; }
    .ok { fill: #3fb950; }
    .warn { fill: #d29922; }
    .info { fill: #58a6ff; }
    .plug { fill: #a371f7; }

    .s1, .s2, .s3, .s4, .s5, .s6, .s7, .old, .lblA, .lblB { opacity: 0; }
    .s1 { animation: s1 16s infinite; }
    .s2 { animation: s2 16s infinite; }
    .s3 { animation: s3 16s infinite; }
    .s4 { animation: s4 16s infinite; }
    .s5 { animation: s5 16s infinite; }
    .s6 { animation: s6 16s infinite; }
    .s7 { animation: s7 16s infinite; }
    .old { animation: old 16s infinite; }
    .lblA { animation: lblA 16s infinite; }
    .lblB { animation: lblB 16s infinite; }
    .bar { transform-origin: 110px 0; animation: bar 16s infinite; }

    @keyframes s1 { 0%, 3% { opacity: 0; } 6%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s2 { 0%, 11% { opacity: 0; } 14%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s3 { 0%, 24% { opacity: 0; } 27%, 40% { opacity: 1; } 43%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 44% { opacity: 0; } 47%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s5 { 0%, 53% { opacity: 0; } 56%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s6 { 0%, 60% { opacity: 0; } 63%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s7 { 0%, 70% { opacity: 0; } 73%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes old { 0% { opacity: 1; } 55% { opacity: 1; } 59%, 96% { opacity: 0.3; } 100% { opacity: 0.3; } }
    @keyframes lblA { 0%, 12% { opacity: 0; } 15%, 58% { opacity: 1; } 61%, 100% { opacity: 0; } }
    @keyframes lblB { 0%, 61% { opacity: 0; } 64%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes bar {
      0%, 6% { transform: scaleX(0.05); fill: #3fb950; }
      22%, 57% { transform: scaleX(0.41); fill: #d29922; }
      63%, 96% { transform: scaleX(0.03); fill: #3fb950; }
      100% { transform: scaleX(0.05); fill: #3fb950; }
    }

    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s4, .s5, .s6, .s7, .old, .lblB { animation: none; opacity: 1; }
      .s3, .lblA { animation: none; opacity: 0; }
      .bar { animation: none; transform: scaleX(0.03); fill: #3fb950; }
    }
  </style>

  <rect x="0.5" y="0.5" width="799" height="319" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text class="title" x="400" y="23" text-anchor="middle">claude · my-project</text>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#30363d"/>

  <g class="old">
    <text class="s1" x="24" y="70"><tspan class="dim">&gt; </tspan>refactor the parser and run the tests</text>
    <text class="s2" x="24" y="98"><tspan class="ok">● </tspan>Done. All 42 tests pass.</text>
  </g>

  <g class="s3">
    <rect x="24" y="118" width="752" height="96" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="44" y="148">Context is at 41%. Hand off and continue in a new session?</text>
    <text class="info" x="44" y="176">&gt; 1. Yes</text>
    <text class="dim" x="44" y="200">  2. No</text>
  </g>

  <g class="old">
    <text class="s4" x="24" y="132"><tspan class="warn">● </tspan>baton: handoff saved to .claude/handoff/5d5c9ead.md</text>
  </g>
  <text class="s5" x="24" y="160"><tspan class="dim">&gt; </tspan>/clear</text>
  <text class="s6 plug" x="24" y="188">› [baton] context reached 41% and the user agreed to hand off …</text>
  <g class="s7">
    <text x="24" y="216"><tspan class="ok">● </tspan>I read the handoff. The parser refactor is done and tests pass.</text>
    <text x="24" y="242">  Next step: the CLI flags. Waiting for your instructions.</text>
  </g>

  <line x1="0" y1="270" x2="800" y2="270" stroke="#30363d"/>
  <text class="dim" x="24" y="299">context</text>
  <rect x="110" y="288" width="400" height="12" rx="6" fill="#21262d"/>
  <rect class="bar" x="110" y="288" width="400" height="12" rx="6" fill="#3fb950"/>
  <text class="lblA warn" x="526" y="299">41% · threshold 40%</text>
  <text class="lblB ok" x="526" y="299">3% · fresh session</text>
</svg>
